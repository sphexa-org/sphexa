sph-test-venv-setup:
  stage: sphexa_run
  image: $MYUENV
  extends: [.uenv-runner-daint-gh200]
  variables:
    WITH_UENV_VIEW: 'default'
    # SLURM_PARTITION: 'debug'
    SLURM_JOB_NUM_NODES: 1
    SLURM_NTASKS: 1
  before_script:
    - pwd
    - date
  script:
    - |
      set -euo pipefail
      bash ci/scripts/setup_testing_venv.sh testing_venv
    - date
  artifacts:
    paths:
      - testing_venv/
