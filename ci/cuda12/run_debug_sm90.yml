sph-check-hdf5-tag-attrs-restart-cuda12-sm90-debug-sphexa-cuda:
  stage: sphexa_run
  needs: ['sph-build-cuda12-sm90-debug']
  image: prgenv-gnu/25.11:v1
  extends: [.uenv-runner-daint-gh200]
  variables:
    WITH_UENV_VIEW: 'default'
    # SLURM_PARTITION: 'debug'
    SLURM_JOB_NUM_NODES: 1
    SLURM_NTASKS: 4
    SLURM_CPUS_PER_TASK: 71
  before_script:
    - pwd
    - date
    - export OMP_NUM_THREADS=64
  script:
    - wget --quiet -O 50c.h5 https://zenodo.org/records/8369645/files/50c.h5
    - $APP_INSTALL_DIR/sphexa-cuda --glass ./50c.h5 --init sedov --G 1.0 -n 40 -s 4 -w 2
    - |
      if [ "$SLURM_PROCID" -eq 0 ]; then
        python -m venv sph-venv
        source sph-venv/bin/activate
        pip install h5py
        python scripts/set_parms.py dump_sedov.h5 --add \
          f_subset x,id \
          id_selection_spheres 0.25,0.25,0.25,0.3 \
          id_selection_spheres_group_ids 1 \
          o_subset sphere_subset \
          w_subset 4
      fi
    - $APP_INSTALL_DIR/sphexa-cuda --init dump_sedov.h5:0 -s 4 -w 2
    - |
      if [ "$SLURM_PROCID" -eq 0 ]; then
        python ci/scripts/check_hdf5_attrs.py ci/reference/tag_sphere.h5 dump_dump_sedov.h5.h5
        if [ $? -ne 0 ]; then
          exit 1
        fi
      fi
    - date

