sph-run-cuda12-sm90-debug-sphexa-cuda:
  stage: sphexa_run
  needs: ['sph-build-cuda12-sm90-debug']
  image: "${MYUENV}"
  extends: [.uenv-runner-daint-gh200]
  variables:
    WITH_UENV_VIEW: 'default'
    # SLURM_PARTITION: 'debug'
    SLURM_JOB_NUM_NODES: 1
    SLURM_NTASKS: 4
    SLURM_CPUS_PER_TASK: 71
  before_script:
    - pwd
    - date
    - export OMP_NUM_THREADS=64
    #- 'export TEST_INSTALL_DIR=`find sphexa+spack/store/ -name sbin |grep sphexa`'
    #- 'export APP_INSTALL_DIR=`echo $TEST_INSTALL_DIR |sed "s-/sbin-/bin-"`'
  script:
    - wget --quiet -O 50c.h5 https://zenodo.org/records/8369645/files/50c.h5
    - $APP_INSTALL_DIR/sphexa-cuda --glass ./50c.h5 --init sedov --G 1.0 -n 100 -s 10
    - date

sph-run-cuda12-sm90-debug-sphexa-cpu:
  stage: sphexa_run
  needs: ['sph-build-cuda12-sm90-debug']
  image: "${MYUENV}"
  extends: [.uenv-runner-daint-gh200]
  variables:
    WITH_UENV_VIEW: 'default'
    # SLURM_PARTITION: 'debug'
    SLURM_JOB_NUM_NODES: 1
    SLURM_NTASKS: 4
    SLURM_CPUS_PER_TASK: 71
  before_script:
    - pwd
    - date
    - export OMP_NUM_THREADS=64
    #- 'export TEST_INSTALL_DIR=`find sphexa+spack/store/ -name sbin |grep sphexa`'
    #- 'export APP_INSTALL_DIR=`echo $TEST_INSTALL_DIR |sed "s-/sbin-/bin-"`'
  script:
    - wget --quiet -O 50c.h5 https://zenodo.org/records/8369645/files/50c.h5
    - $APP_INSTALL_DIR/sphexa --glass ./50c.h5 --init sedov --G 1.0 -n 40 -s 4
    - date
